<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preparación Examen de Matemática - Medicina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">Preparación Examen de Matemática - Medicina</h1>
      <span id="general-progress-pct" class="text-lg font-bold">0% Completado</span>
    </div>
    <div class="bg-slate-950 px-4 py-2 flex gap-2">
      <button onclick="handleLevel1Click()" id="btn-lvl-1" class="px-3 py-1 text-xs font-bold rounded-md bg-amber-500 text-slate-950">Nivel 1</button>
      <button onclick="handleLevel2Click()" id="btn-lvl-2" class="px-3 py-1 text-xs font-bold rounded-md text-slate-500 cursor-not-allowed">Nivel 2 🔒</button>
      <button onclick="handleLevel3Click()" id="btn-lvl-3" class="px-3 py-1 text-xs font-bold rounded-md text-slate-500 cursor-not-allowed">Nivel 3 🔒</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="view-dashboard" class="space-y-6">
      <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
    <div id="view-lesson" class="hidden space-y-6 bg-white p-8 rounded-xl shadow-sm">
      <button onclick="switchTab('dashboard')" class="text-blue-600">← Volver</button>
      <h2 id="lesson-title" class="text-2xl font-bold"></h2>
      <div id="lesson-content"></div>
    </div>
  </main>

  <!-- ARCHIVOS JAVASCRIPT SEPARADOS -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
